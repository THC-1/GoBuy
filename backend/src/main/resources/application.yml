spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/gobuy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.example.backend: info

gobuy:
  jwt:
    secret: ${GOBUY_JWT_SECRET:GoBuyLocalJwtSecretKeyForDevOnly2026!}
    issuer: gobuy-backend
    admin-expire-minutes: 720
    user-expire-minutes: 10080
