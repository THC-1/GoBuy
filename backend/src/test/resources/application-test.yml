spring:
  datasource:
    url: jdbc:h2:mem:gobuy-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

gobuy:
  jwt:
    secret: GoBuyTestJwtSecretKeyForIntegration2026!
    issuer: gobuy-backend-test
    admin-expire-minutes: 720
    user-expire-minutes: 10080
